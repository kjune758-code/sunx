services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quant
      MYSQL_USER: quant
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  quant-engine:
    build: ../quant-engine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/quant
      DB_USER: quant
      DB_PASSWORD: ${DB_PASSWORD}
      ENGINE_URL: http://quant-engine:8000
    depends_on:
      mysql:
        condition: service_healthy
      quant-engine:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  mysql-data:
